name: Build Rivian-Dom Prebuilt

# Manual until a device-built QCOM artifact package is published via the
# QCOM_ARTIFACT_PACKAGE_URL repository variable (see the fetch step below).
# Restore the push trigger on Rivian-Dom-src once that package exists.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rivian-dom-prebuilt
  cancel-in-progress: false

env:
  GIT_EMAIL: "100325903+TonyJOM@users.noreply.github.com"
  GIT_NAME: "CompassPilot Build Bot"
  SOURCE_BRANCH: Rivian-Dom-src
  OUTPUT_BRANCH: Rivian-Dom

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git config http.postBuffer 104857600

      - name: Record source commit
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache TICI sysroot
        id: sysroot-cache
        uses: actions/cache@v6
        with:
          path: .comma_sysroot
          key: rivian-dom-sysroot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openpilot/system/hardware/tici/agnos.json', 'tools/laptop_device_build/extract_sysroot_from_agnos.py') }}

      - name: Prepare TICI sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils \
            e2fsprogs \
            xz-utils

          mkdir -p .comma_sysroot "$RUNNER_TEMP/agnos"
          python3 tools/laptop_device_build/extract_sysroot_from_agnos.py \
            --manifest openpilot/system/hardware/tici/agnos.json \
            --output-dir .comma_sysroot \
            --cache-dir "$RUNNER_TEMP/agnos"
          rm -rf "$RUNNER_TEMP/agnos"

      - name: Validate TICI sysroot
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .comma_sysroot/usr/local/lib \
            .comma_sysroot/usr/local/include \
            .comma_sysroot/lib/aarch64-linux-gnu \
            .comma_sysroot/usr/lib/aarch64-linux-gnu \
            .comma_sysroot/usr/include \
            .comma_sysroot/system/vendor/lib64; do
            test -d "$path"
          done

          du -sh .comma_sysroot
          df -h "$GITHUB_WORKSPACE"

      - name: Cache StarPilot build data
        uses: actions/cache@v6
        with:
          path: |
            .cache/scons
            .cache/uv
          key: rivian-dom-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            rivian-dom-build-${{ runner.os }}-${{ runner.arch }}-

      # Laptop/CI builds cannot compile QCOM driving models; they import a
      # verified package produced on a comma device (see
      # tools/laptop_device_build/VERIFIED_QCOM_ARTIFACTS.md). Provide it as a
      # tar.gz URL in the QCOM_ARTIFACT_PACKAGE_URL repository variable.
      - name: Fetch verified QCOM artifact package
        shell: bash
        env:
          QCOM_ARTIFACT_PACKAGE_URL: ${{ vars.QCOM_ARTIFACT_PACKAGE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${QCOM_ARTIFACT_PACKAGE_URL}" ]]; then
            echo "QCOM_ARTIFACT_PACKAGE_URL is not set; a source-matched QCOM artifact package is required." >&2
            exit 1
          fi
          mkdir -p .cache/qcom-artifact-package
          curl -fsSL "${QCOM_ARTIFACT_PACKAGE_URL}" | tar -xz -C .cache/qcom-artifact-package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build StarPilot device container
        uses: docker/build-push-action@v7
        with:
          context: tools/laptop_device_build
          file: tools/laptop_device_build/Dockerfile
          platforms: linux/arm64
          load: true
          tags: starpilot-larch64-builder:latest
          cache-from: type=gha,scope=rivian-dom-larch64-builder
          cache-to: type=gha,mode=min,scope=rivian-dom-larch64-builder
          provenance: false

      - name: Build Rivian-Dom device artifacts
        shell: bash
        env:
          SP_ENABLE_SCONS_CACHE: "1"
        run: |
          set -euo pipefail
          # The complete build verifies device artifacts, writes prebuilt.json and sets prebuilt.
          # RELEASE is unset so Panda keeps the DEBUG safety needed for harness longitudinal control.
          ./build 4

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail

          required_outputs=(
            prebuilt
            prebuilt.json
            openpilot/cereal/libcereal.a
            openpilot/common/libparams_c.so
            openpilot/selfdrive/pandad/pandad
            openpilot/selfdrive/pandad/rivian_long_fw.bin.signed
            panda/board/obj/panda_h7.bin.signed
          )
          for output in "${required_outputs[@]}"; do
            if [[ ! -s "$output" && "$output" != "prebuilt" ]]; then
              echo "Required Rivian-Dom build output is missing or empty: $output" >&2
              exit 1
            fi
            test -e "$output"
          done

          RIVIAN_PANDA_OUTPUTS=(
            "panda/board/obj/bootstub.panda_h7_rivian_wake.bin"
            "panda/board/obj/panda_h7_rivian_wake.bin.signed"
            "panda/board/obj/bootstub.panda_rivian_wake.bin"
            "panda/board/obj/panda_rivian_wake.bin.signed"
          )
          for output in "${RIVIAN_PANDA_OUTPUTS[@]}"; do
            if [[ ! -s "${output}" ]]; then
              echo "Required Rivian Panda firmware output is missing or empty: ${output}" >&2
              exit 1
            fi
          done

          if cmp -s panda/board/obj/panda_h7_rivian_wake.bin.signed panda/board/obj/panda_h7.bin.signed; then
            echo "Rivian Panda firmware unexpectedly matches the default H7 firmware." >&2
            exit 1
          fi

          if git grep -Il '^version https://git-lfs\.github\.com/spec/v1' > /tmp/lfs_ptrs.txt; then
            echo "LFS pointer stubs found in build output:" >&2
            cat /tmp/lfs_ptrs.txt >&2
            exit 1
          fi

          while IFS= read -r -d '' path; do
            if [[ -f "$path" ]] && (( $(stat -c %s "$path") > 103809024 )); then
              echo "$path"
            fi
          done < <(git ls-files -z) > /tmp/oversized_files.txt

          if [[ -s /tmp/oversized_files.txt ]]; then
            echo "Files larger than 99 MB found in build output:" >&2
            cat /tmp/oversized_files.txt >&2
            exit 1
          fi

      - name: Commit build output
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          git add -- prebuilt prebuilt.json

          RIVIAN_PANDA_OUTPUTS=(
            "panda/board/obj/bootstub.panda_h7_rivian_wake.bin"
            "panda/board/obj/panda_h7_rivian_wake.bin.signed"
            "panda/board/obj/bootstub.panda_rivian_wake.bin"
            "panda/board/obj/panda_rivian_wake.bin.signed"
          )
          git add -- "${RIVIAN_PANDA_OUTPUTS[@]}"
          for output in "${RIVIAN_PANDA_OUTPUTS[@]}"; do
            git ls-files --error-unmatch "${output}" >/dev/null
          done

          git ls-files --error-unmatch prebuilt >/dev/null
          git commit --allow-empty -m "build" \
            -m "source branch: ${SOURCE_BRANCH}" \
            -m "source commit: ${SOURCE_SHA}"

      - name: Publish prebuilt branch
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin "refs/heads/${OUTPUT_BRANCH}" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/${OUTPUT_BRANCH}:${remote_sha}" \
              origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
          fi

          {
            echo "### Rivian-Dom prebuilt published"
            echo "- Source: \`${SOURCE_BRANCH}\` at \`${SOURCE_SHA}\`"
            echo "- Output: \`${OUTPUT_BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"
